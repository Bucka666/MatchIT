<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIT — Card Identifier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07060e;
    --surface: rgba(15,14,26,0.85);
    --surface-solid: #0f0e1a;
    --border: rgba(255,255,255,0.08);
    --text: #f0ecff;
    --muted: #7b7498;
    --gold: #ffd700;
    --gold-light: #ffe566;
    --emerald: #00ff88;
    --ruby: #ff2d6f;
    --sapphire: #4d8eff;
    --violet: #b14dff;
    --cyan: #00e5ff;
    --font-display: 'Orbitron', monospace;
    --font-body: 'DM Sans', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Animated background ── */
  .bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg-canvas::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(177,77,255,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 80%, rgba(0,229,255,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255,45,111,0.08) 0%, transparent 40%),
      radial-gradient(ellipse at 10% 90%, rgba(0,255,136,0.06) 0%, transparent 40%),
      radial-gradient(ellipse at 90% 10%, rgba(255,215,0,0.08) 0%, transparent 40%);
    animation: bgDrift 20s ease-in-out infinite alternate;
  }
  .bg-canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 100px, rgba(255,255,255,0.01) 100px, rgba(255,255,255,0.01) 101px),
      repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.01) 100px, rgba(255,255,255,0.01) 101px);
  }
  @keyframes bgDrift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-3%, -2%) rotate(2deg); }
  }

  /* Floating orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: orbFloat 15s ease-in-out infinite alternate;
  }
  .orb-1 { width: 400px; height: 400px; background: var(--violet); top: -10%; left: -5%; animation-delay: 0s; }
  .orb-2 { width: 350px; height: 350px; background: var(--cyan); bottom: -10%; right: -5%; animation-delay: -5s; }
  .orb-3 { width: 300px; height: 300px; background: var(--ruby); top: 40%; left: 60%; animation-delay: -10s; opacity: 0.2; }
  .orb-4 { width: 250px; height: 250px; background: var(--emerald); top: 60%; left: 10%; animation-delay: -7s; opacity: 0.15; }
  @keyframes orbFloat {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.1); }
    100% { transform: translate(-20px, 30px) scale(0.95); }
  }

  .content { position: relative; z-index: 1; }

  /* ── Header ── */
  .header {
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
    background: rgba(7,6,14,0.7);
    backdrop-filter: blur(20px);
  }
  .logo { display: flex; align-items: center; gap: 0.75rem; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    box-shadow: 0 0 20px rgba(177,77,255,0.3);
  }
  .logo-text {
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--violet), var(--cyan), var(--emerald));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.05em;
  }
  .logo-badge {
    font-size: 0.55rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--bg);
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
  }
  .header-controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .ctrl-group { display: flex; flex-direction: column; gap: 0.15rem; }
  .ctrl-label { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cyan); }
  .ctrl-input, .ctrl-select {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text);
    padding: 0.35rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-family: var(--font-body);
    backdrop-filter: blur(10px); transition: all 0.2s;
  }
  .ctrl-input:focus, .ctrl-select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,229,255,0.1); }
  .ctrl-input { width: 180px; }

  .main { max-width: 1000px; margin: 0 auto; padding: 2rem; }

  /* ── Scan Area ── */
  .scan-area {
    position: relative;
    border: 2px dashed rgba(177,77,255,0.3);
    border-radius: 20px;
    padding: 3.5rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.4s;
    background: var(--surface);
    backdrop-filter: blur(20px);
    overflow: hidden;
  }
  .scan-area::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--violet), var(--cyan), var(--emerald), var(--gold));
    z-index: -1;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .scan-area:hover::before { opacity: 0.3; }
  .scan-area:hover { border-color: transparent; }
  .scan-area.has-image { padding: 1.5rem; border-style: solid; border-color: rgba(177,77,255,0.4); }
  .scan-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }
  .scan-icon {
    font-size: 3.5rem;
    margin-bottom: 0.75rem;
    animation: scanPulse 3s ease-in-out infinite;
  }
  @keyframes scanPulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.05); filter: brightness(1.2); }
  }
  .scan-title {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.3rem;
  }
  .scan-hint { color: var(--muted); font-size: 0.8rem; }
  .preview-img {
    max-height: 280px; max-width: 100%;
    border-radius: 12px; object-fit: contain;
    border: 2px solid rgba(177,77,255,0.3);
    box-shadow: 0 0 30px rgba(177,77,255,0.1);
  }

  /* ── Button ── */
  .btn-identify {
    width: 100%; margin-top: 1.25rem; padding: 0.9rem 2rem; border: none; border-radius: 12px;
    font-family: var(--font-display); font-size: 0.95rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--violet), var(--sapphire), var(--cyan));
    color: white;
    box-shadow: 0 4px 25px rgba(177,77,255,0.3);
  }
  .btn-identify::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
    animation: btnShimmer 3s ease-in-out infinite;
  }
  @keyframes btnShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .btn-identify:hover { box-shadow: 0 6px 35px rgba(177,77,255,0.5); transform: translateY(-2px); }
  .btn-identify:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-identify:disabled::after { display: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Results ── */
  .results { margin-top: 2.5rem; display: none; }
  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .results-title {
    font-family: var(--font-display); font-size: 1rem; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .results-meta { display: flex; gap: 0.75rem; font-size: 0.7rem; color: var(--muted); }
  .meta-tag { background: rgba(177,77,255,0.1); color: var(--violet); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.65rem; }

  /* ── Result Card ── */
  .result {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1.5rem;
    align-items: start;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .result::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(177,77,255,0.2), rgba(0,229,255,0.1), rgba(0,255,136,0.05));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .result:hover::before { opacity: 1; }
  .result:first-child {
    border-color: rgba(255,215,0,0.25);
    background: linear-gradient(135deg, rgba(255,215,0,0.03), rgba(177,77,255,0.02));
  }
  .result:first-child::before { opacity: 1; background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(177,77,255,0.2), rgba(0,229,255,0.1)); }

  /* Card image with BOLD holographic effect */
  .result-card-img { position: relative; }
  .result-thumb {
    width: 130px; height: 182px;
    object-fit: contain; border-radius: 10px;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: zoom-in;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
  }
  .result-thumb:hover {
    transform: scale(1.15) rotate(-3deg);
    box-shadow:
      0 15px 50px rgba(0,0,0,0.6),
      0 0 40px rgba(177,77,255,0.4),
      0 0 80px rgba(0,229,255,0.25),
      0 0 120px rgba(255,215,0,0.1);
    border-color: rgba(177,77,255,0.5);
  }
  .result:first-child .result-thumb {
    border-color: rgba(255,215,0,0.5);
    box-shadow: 0 0 30px rgba(255,215,0,0.25), 0 0 60px rgba(177,77,255,0.15);
    animation: goldPulse 3s ease-in-out infinite;
  }
  @keyframes goldPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255,215,0,0.25), 0 0 60px rgba(177,77,255,0.15); }
    50% { box-shadow: 0 0 45px rgba(255,215,0,0.4), 0 0 90px rgba(177,77,255,0.25); }
  }

  /* Rank badges with glow */
  .rank-badge {
    position: absolute; top: -8px; left: -8px;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 900; z-index: 1;
    border: 2px solid var(--bg);
  }
  .rank-1 {
    background: linear-gradient(135deg, #ffd700, #ffed4a);
    color: #1a1a00;
    font-size: 0.9rem;
    box-shadow: 0 0 15px rgba(255,215,0,0.5);
    animation: crownGlow 2s ease-in-out infinite;
  }
  @keyframes crownGlow {
    0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.5); }
    50% { box-shadow: 0 0 25px rgba(255,215,0,0.8); }
  }
  .rank-2 { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #1a1a1a; box-shadow: 0 2px 10px rgba(192,192,192,0.3); }
  .rank-3 { background: linear-gradient(135deg, #cd7f32, #e8a55e); color: #1a1000; box-shadow: 0 2px 10px rgba(205,127,50,0.3); }
  .rank-other { background: var(--surface-solid); color: var(--muted); }

  .result-body { display: flex; flex-direction: column; gap: 0.5rem; }
  .card-name {
    font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
    color: var(--text); line-height: 1.2; letter-spacing: 0.02em;
  }
  .result:first-child .card-name {
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  .card-set { font-size: 0.78rem; font-weight: 600; color: var(--cyan); }
  .card-sku { font-size: 0.65rem; color: var(--muted); font-family: var(--font-display); letter-spacing: 0.05em; }

  /* Tags with BOLD glow */
  .card-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .card-tag {
    font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 0.2rem 0.5rem; border-radius: 4px;
  }
  .card-tag.rarity-common { background: rgba(140,140,140,0.1); color: #999; border: 1px solid rgba(140,140,140,0.15); }
  .card-tag.rarity-uncommon { background: rgba(0,255,136,0.1); color: var(--emerald); border: 1px solid rgba(0,255,136,0.25); box-shadow: 0 0 10px rgba(0,255,136,0.15); text-shadow: 0 0 4px rgba(0,255,136,0.2); }
  .card-tag.rarity-rare { background: rgba(77,142,255,0.12); color: var(--sapphire); border: 1px solid rgba(77,142,255,0.3); box-shadow: 0 0 12px rgba(77,142,255,0.2), inset 0 0 8px rgba(77,142,255,0.05); text-shadow: 0 0 6px rgba(77,142,255,0.3); }
  .card-tag.rarity-mythic, .card-tag.rarity-secret {
    background: rgba(255,45,111,0.12);
    color: var(--ruby);
    border: 1px solid rgba(255,45,111,0.3);
    box-shadow: 0 0 12px rgba(255,45,111,0.2), inset 0 0 8px rgba(255,45,111,0.05);
    text-shadow: 0 0 6px rgba(255,45,111,0.3);
    animation: mythicPulse 2.5s ease-in-out infinite;
  }
  @keyframes mythicPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(255,45,111,0.2); }
    50% { box-shadow: 0 0 20px rgba(255,45,111,0.4); }
  }
  .card-tag.rarity-ultra {
    background: rgba(255,215,0,0.1);
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.3);
    box-shadow: 0 0 12px rgba(255,215,0,0.2);
    text-shadow: 0 0 6px rgba(255,215,0,0.3);
  }
  .card-tag:not([class*="rarity"]) { background: rgba(177,77,255,0.08); color: var(--violet); border: 1px solid rgba(177,77,255,0.2); }

  /* Prices */
  .card-prices { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .price-chip {
    display: flex; align-items: baseline; gap: 0.3rem;
    padding: 0.3rem 0.65rem; border-radius: 8px;
    background: rgba(0,255,136,0.04);
    border: 1px solid rgba(0,255,136,0.12);
    backdrop-filter: blur(10px);
  }
  .price-source { font-size: 0.55rem; font-weight: 600; text-transform: uppercase; color: var(--muted); }
  .price-value { font-size: 0.85rem; font-weight: 800; color: var(--emerald); font-family: var(--font-display); }

  /* Marketplace */
  .marketplace {
    display: flex; flex-wrap: wrap; gap: 0.35rem;
    margin-top: 0.4rem; padding-top: 0.6rem;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .mp-link {
    font-size: 0.68rem; font-weight: 600;
    padding: 0.3rem 0.65rem; border-radius: 6px;
    text-decoration: none; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.25rem;
    backdrop-filter: blur(10px);
  }
  .mp-buy { color: var(--emerald); background: rgba(0,255,136,0.04); border: 1px solid rgba(0,255,136,0.12); }
  .mp-buy:hover { background: rgba(0,255,136,0.12); border-color: rgba(0,255,136,0.3); box-shadow: 0 0 12px rgba(0,255,136,0.1); }
  .mp-sell { color: var(--gold); background: rgba(255,215,0,0.04); border: 1px solid rgba(255,215,0,0.12); }
  .mp-sell:hover { background: rgba(255,215,0,0.12); border-color: rgba(255,215,0,0.3); box-shadow: 0 0 12px rgba(255,215,0,0.1); }

  .xrefs { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
  .xref-link {
    font-size: 0.68rem; font-weight: 600;
    padding: 0.2rem 0.5rem; border-radius: 4px;
    text-decoration: none;
    background: rgba(77,142,255,0.04); border: 1px solid rgba(77,142,255,0.12);
    color: var(--sapphire); transition: all 0.2s;
  }
  .xref-link:hover { background: rgba(77,142,255,0.12); box-shadow: 0 0 10px rgba(77,142,255,0.1); }

  /* Confidence ring with BOLD glow */
  .confidence { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; min-width: 80px; }
  .conf-ring { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .conf-ring svg { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
  .conf-ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .conf-ring .track { stroke: rgba(255,255,255,0.04); }
  .conf-ring .fill-high { stroke: var(--emerald); filter: drop-shadow(0 0 10px rgba(0,255,136,0.6)); }
  .conf-ring .fill-mid { stroke: var(--gold); filter: drop-shadow(0 0 10px rgba(255,215,0,0.6)); }
  .conf-ring .fill-low { stroke: var(--ruby); filter: drop-shadow(0 0 10px rgba(255,45,111,0.6)); }
  .conf-pct { font-family: var(--font-display); font-size: 0.95rem; font-weight: 900; z-index: 1; letter-spacing: 0.02em; }
  .conf-pct.high { color: var(--emerald); text-shadow: 0 0 15px rgba(0,255,136,0.4); }
  .conf-pct.mid { color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.4); }
  .conf-pct.low { color: var(--ruby); text-shadow: 0 0 15px rgba(255,45,111,0.4); }
  .conf-label { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  .error-msg { background: rgba(255,45,111,0.06); border: 1px solid rgba(255,45,111,0.15); color: var(--ruby); padding: 1rem; border-radius: 12px; margin-top: 1rem; font-size: 0.82rem; backdrop-filter: blur(10px); }
  .json-toggle { color: var(--muted); font-size: 0.7rem; cursor: pointer; margin-top: 1rem; opacity: 0.5; transition: all 0.2s; }
  .json-toggle:hover { opacity: 1; color: var(--cyan); }
  .json-raw { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-top: 0.5rem; font-family: 'Courier New', monospace; font-size: 0.65rem; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; display: none; color: var(--muted); }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(7,6,14,0.95); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; backdrop-filter: blur(12px); }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 14px; box-shadow: 0 0 80px rgba(177,77,255,0.2), 0 0 40px rgba(0,229,255,0.1); }
  .lightbox-label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: var(--cyan); font-size: 0.75rem; font-family: var(--font-display); background: var(--surface-solid); padding: 0.4rem 1.2rem; border-radius: 8px; border: 1px solid rgba(0,229,255,0.2); letter-spacing: 0.05em; }

  /* Sparkles on #1 result */
  .result:first-child::after {
    content: '✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧';
    position: absolute;
    top: -1px; left: 0; right: 0;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.5rem;
    color: rgba(255,215,0,0.6);
    animation: sparkleFloat 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes sparkleFloat {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    25% { opacity: 1; transform: translateY(-3px); }
    50% { opacity: 0.6; transform: translateY(1px); }
    75% { opacity: 1; transform: translateY(-2px); }
  }
  .result:first-child .rank-badge::after {
    content: '✨';
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 0.9rem;
    animation: starSpin 2s ease-in-out infinite;
  }
  @keyframes starSpin {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
    50% { transform: scale(1.3) rotate(20deg); opacity: 1; }
  }

  .footer {
    text-align: center; margin-top: 3rem; padding: 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .footer span {
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }

  @media (max-width: 700px) {
    .header { flex-direction: column; padding: 1rem; }
    .ctrl-input { width: 140px; }
    .main { padding: 1rem; }
    .result { grid-template-columns: auto 1fr; gap: 1rem; padding: 1rem; }
    .confidence { display: none; }
    .result-thumb { width: 95px; height: 133px; }
    .card-name { font-size: 0.9rem; }
    .orb { display: none; }
  }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="content">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">MATCHIT</span>
      <span class="logo-badge">Card ID</span>
    </div>
    <div class="header-controls">
      <div class="ctrl-group"><span class="ctrl-label">Endpoint</span><input class="ctrl-input" type="text" id="apiUrl" value="http://localhost:5000/api/v1/match"></div>
      <div class="ctrl-group"><span class="ctrl-label">API Key</span><input class="ctrl-input" type="password" id="apiKey" value=""></div>
      <div class="ctrl-group"><span class="ctrl-label">Vertical</span><select class="ctrl-select" id="verticalSelect" onchange="switchVertical()"><option value="">Loading...</option></select></div>
      <div class="ctrl-group"><span class="ctrl-label">Results</span><select class="ctrl-select" id="topK"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></div>
    </div>
  </div>

  <div class="main">
    <div class="scan-area" id="uploadArea">
      <input type="file" id="imageInput" accept="image/*">
      <div id="uploadPlaceholder">
        <div class="scan-icon">🃏</div>
        <div class="scan-title">IDENTIFY YOUR CARD</div>
        <div class="scan-hint">Tap to photograph · Select from gallery · Drag & drop</div>
      </div>
      <img id="previewImg" class="preview-img" style="display:none;cursor:zoom-in;" onclick="openLightbox(this.src,'Your card')">
    </div>
    <button class="btn-identify" id="matchBtn" disabled>⚡ Identify Card</button>
    <div class="results" id="resultsSection">
      <div class="results-header">
        <span class="results-title">✦ Results</span>
        <div class="results-meta" id="responseMeta"></div>
      </div>
      <div id="resultsList"></div>
      <div class="json-toggle" onclick="toggleJson()">▸ Raw API Response</div>
      <pre class="json-raw" id="jsonRaw"></pre>
    </div>
    <div id="errorArea"></div>
    <div class="footer">Powered by <span>MatchIT</span> Visual Identification Engine</div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
  <div class="lightbox-label" id="lightboxLabel"></div>
</div>

<script>
const uploadArea=document.getElementById('uploadArea'),imageInput=document.getElementById('imageInput'),previewImg=document.getElementById('previewImg'),placeholder=document.getElementById('uploadPlaceholder'),matchBtn=document.getElementById('matchBtn'),resultsSection=document.getElementById('resultsSection'),resultsList=document.getElementById('resultsList'),responseMeta=document.getElementById('responseMeta'),errorArea=document.getElementById('errorArea'),jsonRaw=document.getElementById('jsonRaw');
let selectedFile=null;

async function loadVerticals(){const u=document.getElementById('apiUrl').value.replace('/match','/verticals');try{const r=await fetch(u);const d=await r.json();const s=document.getElementById('verticalSelect');s.innerHTML='';for(const v of d.verticals){const o=document.createElement('option');o.value=v.id;o.textContent=`${v.icon} ${v.name}`.trim();s.appendChild(o);}const h=await fetch(document.getElementById('apiUrl').value.replace('/match','/health'));const hd=await h.json();s.value=hd.vertical;}catch(e){console.error('Verticals:',e);}}
async function switchVertical(){const b=document.getElementById('apiUrl').value.replace('/match',''),k=document.getElementById('apiKey').value.trim(),v=document.getElementById('verticalSelect').value;if(!k||!v)return;try{const fd=new FormData();fd.append('vertical',v);const r=await fetch(`${b}/switch_vertical`,{method:'POST',headers:{'X-API-Key':k},body:fd});const d=await r.json();if(d.status==='switched'){resultsSection.style.display='none';errorArea.innerHTML=`<div style="color:var(--cyan);font-size:0.8rem;margin-top:0.5rem;font-family:var(--font-display);letter-spacing:0.05em;">⚡ ${d.vertical_name} — ${d.front_embeddings} loaded</div>`;setTimeout(()=>{errorArea.innerHTML='';},3000);}}catch(e){showError(e.message);}}
window.addEventListener('load',()=>setTimeout(loadVerticals,500));

uploadArea.addEventListener('dragover',(e)=>{e.preventDefault();uploadArea.classList.add('dragover');});
uploadArea.addEventListener('dragleave',()=>uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop',(e)=>{e.preventDefault();uploadArea.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
imageInput.addEventListener('change',(e)=>{if(e.target.files.length)handleFile(e.target.files[0]);});
function handleFile(f){selectedFile=f;const r=new FileReader();r.onload=(e)=>{previewImg.src=e.target.result;previewImg.style.display='block';placeholder.style.display='none';uploadArea.classList.add('has-image');matchBtn.disabled=false;};r.readAsDataURL(f);}

matchBtn.addEventListener('click',async()=>{if(!selectedFile)return;const u=document.getElementById('apiUrl').value.trim(),k=document.getElementById('apiKey').value.trim();if(!k){showError('Enter your API key');return;}matchBtn.disabled=true;matchBtn.innerHTML='<span class="spinner"></span> SCANNING...';errorArea.innerHTML='';resultsSection.style.display='none';const fd=new FormData();fd.append('image',selectedFile);fd.append('top_k',document.getElementById('topK').value);fd.append('include_diagnostics','true');try{const r=await fetch(u,{method:'POST',headers:{'X-API-Key':k},body:fd});const d=await r.json();if(!r.ok){showError(d.error||`HTTP ${r.status}`);return;}renderResults(d);}catch(e){showError(e.message);}finally{matchBtn.disabled=false;matchBtn.textContent='⚡ Identify Card';}});

function getCurrency(s){s=(s||'').toLowerCase();if(s.includes('cardmarket'))return'€';return'$';}
function toGBP(usd){return(usd*0.79).toFixed(2);}
function rarityClass(r){if(!r)return'';r=r.toLowerCase();if(r.includes('common')&&!r.includes('uncommon'))return'rarity-common';if(r.includes('uncommon'))return'rarity-uncommon';if(r.includes('mythic')||r.includes('secret')||r.includes('ultra'))return'rarity-mythic';if(r.includes('rare')||r.includes('holo'))return'rarity-rare';return'';}

function renderResults(data){
  responseMeta.innerHTML=`<span>⏱ ${data.timing_ms}ms</span><span class="meta-tag">${data.vertical||'?'}</span>`;
  let html='';
  for(const m of data.matches){
    const rawSim=m.similarity||m.score||m.probability;
    const pct=Math.min(100,Math.max(0,Math.round(((rawSim-0.80)/0.18)*100)));
    const level=pct>=75?'high':pct>=45?'mid':'low';
    const apiBase=document.getElementById('apiUrl').value.replace('/match','');
    const circ=2*Math.PI*28,dash=circ-(circ*pct/100);
    let imgSrc='';if(m.images&&m.images.length>0)imgSrc=`${apiBase}/image/${m.images[0].image_id}`;
    const p=m.profile||{},cardName=p.name||p.title||'',setName=p.set_name||'',cardNumber=p.card_number||'',rarity=p.rarity||'';

    let tagsHtml='';
    if(rarity)tagsHtml+=`<span class="card-tag ${rarityClass(rarity)}">${rarity.replace(/_/g,' ')}</span>`;
    if(p.energy_type)tagsHtml+=`<span class="card-tag">${p.energy_type.replace(/_/g,' ')}</span>`;
    if(p.mtg_color)tagsHtml+=`<span class="card-tag">${p.mtg_color.replace(/_/g,' ')}</span>`;
    if(p.ygo_card_type)tagsHtml+=`<span class="card-tag">${p.ygo_card_type.replace(/_/g,' ')}</span>`;
    if(p.set_era)tagsHtml+=`<span class="card-tag">${p.set_era.replace(/_/g,' ')}</span>`;
    if(p.type_line)tagsHtml+=`<span class="card-tag">${p.type_line}</span>`;

    let pricesHtml='';
    if(p.prices&&typeof p.prices==='object'){
      for(const[source,sdata]of Object.entries(p.prices)){
        if(!sdata||typeof sdata!=='object')continue;
        let best=null,label='';
        for(const[variant,vdata]of Object.entries(sdata)){
          if(vdata&&typeof vdata==='object'){const pr=vdata.market||vdata.trend||vdata.avg_sell||vdata.mid;if(pr&&(!best||pr<best)){best=pr;label=variant;}}
          else if(typeof vdata==='number'&&vdata>0){if(!best||vdata<best){best=vdata;label=variant;}}
        }
        if(best){
          const curr=getCurrency(source);
          const val=Number(best).toFixed(2);
          const gbp=curr==='$'?` (~£${toGBP(best)})`:curr==='€'?` (~£${(best*0.86).toFixed(2)})`:'';
          pricesHtml+=`<div class="price-chip"><span class="price-source">${source}</span><span class="price-value">${curr}${val}${gbp}</span></div>`;
        }
      }
    }

    let mpHtml='';
    if(cardName){
      const st=`${cardName} ${setName} ${cardNumber}`.trim(),enc=encodeURIComponent(st);
      mpHtml=`
        <a class="mp-link mp-buy" href="https://www.google.com/search?q=site:bigorbitcards.co.uk+${enc}" target="_blank">🇬🇧 Big Orbit</a>
        <a class="mp-link mp-sell" href="https://www.google.com/search?q=site:bigorbitcards.co.uk+sell+${enc}" target="_blank">💷 Sell</a>
        ${p.tcgplayer_url?`<a class="mp-link mp-buy" href="${p.tcgplayer_url}" target="_blank">🇺🇸 TCGPlayer</a>`:`<a class="mp-link mp-buy" href="https://www.tcgplayer.com/search/all/product?q=${enc}" target="_blank">🇺🇸 TCGPlayer</a>`}
        ${p.cardmarket_url?`<a class="mp-link mp-buy" href="${p.cardmarket_url}" target="_blank">🇪🇺 Cardmarket</a>`:`<a class="mp-link mp-buy" href="https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=${enc}" target="_blank">🇪🇺 Cardmarket</a>`}
        <a class="mp-link mp-buy" href="https://www.google.com/search?q=site:cardtrader.com+${enc}" target="_blank">🔄 CardTrader</a>
        <a class="mp-link mp-buy" href="https://totalcards.net/search?q=${enc}" target="_blank">🇬🇧 Total Cards</a>
        <a class="mp-link mp-buy" href="https://www.miniaturemarket.com/searchresults?q=${enc}" target="_blank">🇺🇸 Miniature Market</a>`;
    }

    let xrefHtml='';
    if(p.crossrefs&&Array.isArray(p.crossrefs)){
      const urls={'hd':(c)=>`https://www.davenport-burgess.com/search/${encodeURIComponent(c)}`,'jma':(c)=>`https://jma-uk.co.uk/catalogsearch/result/?q=${encodeURIComponent(c)}`,'silca':(c)=>`https://www.aldridgesecurity.co.uk/catalogsearch/result/?q=${encodeURIComponent(c)}`};
      for(const x of p.crossrefs){const b=x.brand.toLowerCase(),lb=b==='hd'?'HD (Davenport)':x.brand.toUpperCase(),u=urls[b]?urls[b](x.code):`https://www.google.com/search?q=${x.brand}+${encodeURIComponent(x.code)}+key+blank`;xrefHtml+=`<a class="xref-link" href="${u}" target="_blank">${lb}: ${x.code}</a>`;}
    }

    let genLinks='';
    if(!cardName){for(const[k,v]of Object.entries(p)){if(typeof v==='string'&&v.startsWith('http')){const l=k.replace(/_url/g,'').replace(/_/g,' ').trim()||'Link';genLinks+=`<a class="mp-link mp-buy" href="${v}" target="_blank">${l.charAt(0).toUpperCase()+l.slice(1)}</a>`;}}}

    const rc=m.rank<=3?`rank-${m.rank}`:'rank-other';
    html+=`
      <div class="result">
        <div class="result-card-img">
          <div class="rank-badge ${rc}">${m.rank===1?'👑':'#'+m.rank}</div>
          ${imgSrc?`<img class="result-thumb" src="${imgSrc}" onclick="openLightbox('${imgSrc}','${(cardName||m.sku).replace(/'/g,"\\'")}')">`:''}
        </div>
        <div class="result-body">
          ${cardName?`<div class="card-name">${cardName}</div>`:''}
          ${setName?`<div class="card-set">${setName}${cardNumber?' #'+cardNumber:''}</div>`:''}
          <div class="card-sku">${m.sku}</div>
          ${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:''}
          ${pricesHtml?`<div class="card-prices">${pricesHtml}</div>`:''}
          ${mpHtml?`<div class="marketplace">${mpHtml}</div>`:''}
          ${xrefHtml?`<div class="xrefs">${xrefHtml}</div>`:''}
          ${genLinks?`<div class="marketplace">${genLinks}</div>`:''}
        </div>
        <div class="confidence">
          <div class="conf-ring">
            <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="fill-${level}" cx="32" cy="32" r="28" stroke-dasharray="${circ}" stroke-dashoffset="${dash}"/></svg>
            <span class="conf-pct ${level}">${pct}%</span>
          </div>
          <span class="conf-label">Match</span>
        </div>
      </div>`;
  }
  resultsList.innerHTML=html;
  jsonRaw.textContent=JSON.stringify(data,null,2);
  resultsSection.style.display='block';
}

function showError(m){errorArea.innerHTML=`<div class="error-msg">${m}</div>`;}
function toggleJson(){jsonRaw.style.display=jsonRaw.style.display==='none'?'block':'none';}
function openLightbox(s,l){document.getElementById('lightboxImg').src=s;document.getElementById('lightboxLabel').textContent=l||'';document.getElementById('lightbox').classList.add('active');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');document.getElementById('lightboxImg').src='';}
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeLightbox();});
</script>
</body>
</html>
