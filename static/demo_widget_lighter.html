<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MatchIT — Card Identifier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1830;
    --surface: rgba(35,32,65,0.85);
    --surface-solid: #252248;
    --border: rgba(255,255,255,0.1);
    --text: #f0ecff;
    --muted: #9b95b8;
    --gold: #ffd700;
    --gold-light: #ffe566;
    --emerald: #00ff88;
    --ruby: #ff2d6f;
    --sapphire: #4d8eff;
    --violet: #b14dff;
    --cyan: #00e5ff;
    --font-display: 'Orbitron', monospace;
    --font-body: 'DM Sans', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .bg-canvas {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(135deg, #1a1830, #1e1a3a, #221e42);
  }
  .bg-canvas::before {
    content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(177,77,255,0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 80%, rgba(0,229,255,0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255,45,111,0.12) 0%, transparent 40%),
      radial-gradient(ellipse at 10% 90%, rgba(0,255,136,0.1) 0%, transparent 40%),
      radial-gradient(ellipse at 90% 10%, rgba(255,215,0,0.12) 0%, transparent 40%);
    animation: bgDrift 20s ease-in-out infinite alternate;
  }
  .bg-canvas::after {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 100px, rgba(255,255,255,0.015) 100px, rgba(255,255,255,0.015) 101px),
      repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.015) 100px, rgba(255,255,255,0.015) 101px);
  }
  @keyframes bgDrift { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(-3%,-2%) rotate(2deg); } }

  .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: orbFloat 15s ease-in-out infinite alternate; }
  .orb-1 { width: 450px; height: 450px; background: var(--violet); top: -10%; left: -5%; opacity: 0.5; }
  .orb-2 { width: 400px; height: 400px; background: var(--cyan); bottom: -10%; right: -5%; animation-delay: -5s; opacity: 0.5; }
  .orb-3 { width: 350px; height: 350px; background: var(--ruby); top: 40%; left: 60%; animation-delay: -10s; opacity: 0.3; }
  .orb-4 { width: 300px; height: 300px; background: var(--emerald); top: 60%; left: 10%; animation-delay: -7s; opacity: 0.25; }
  @keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.1); } 100% { transform: translate(-20px,30px) scale(0.95); } }

  .content { position: relative; z-index: 1; width: 100%; overflow-x: hidden; }

  .header {
    padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.75rem; border-bottom: 1px solid var(--border);
    background: rgba(30,28,55,0.7); backdrop-filter: blur(20px);
  }
  .logo { display: flex; align-items: center; gap: 0.75rem; }
  .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--violet), var(--cyan)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 0 25px rgba(177,77,255,0.4); }
  .logo-text { font-family: var(--font-display); font-size: 1.2rem; font-weight: 900; background: linear-gradient(90deg, var(--violet), var(--cyan), var(--emerald)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.05em; }
  .logo-badge { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--bg); background: linear-gradient(90deg, var(--gold), var(--gold-light)); padding: 0.15rem 0.5rem; border-radius: 3px; }
  .header-controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .ctrl-group { display: flex; flex-direction: column; gap: 0.15rem; }
  .ctrl-label { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cyan); }
  .ctrl-input, .ctrl-select { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-family: var(--font-body); backdrop-filter: blur(10px); transition: all 0.2s; }
  .ctrl-input:focus, .ctrl-select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,229,255,0.15); }
  .ctrl-input { width: 180px; }

  .main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; width: 100%; }

  .scan-area { position: relative; border: 2px dashed rgba(177,77,255,0.35); border-radius: 20px; padding: 3rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.4s; background: var(--surface); backdrop-filter: blur(20px); overflow: hidden; }
  .scan-area::before { content: ''; position: absolute; inset: -2px; border-radius: 22px; background: linear-gradient(135deg, var(--violet), var(--cyan), var(--emerald), var(--gold)); z-index: -1; opacity: 0; transition: opacity 0.4s; }
  .scan-area:hover::before { opacity: 0.4; }
  .scan-area:hover { border-color: transparent; }
  .scan-area.has-image { padding: 1.5rem; border-style: solid; border-color: rgba(177,77,255,0.5); }
  .scan-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }
  .scan-icon { font-size: 3.5rem; margin-bottom: 0.75rem; animation: scanPulse 3s ease-in-out infinite; }
  @keyframes scanPulse { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.05); filter: brightness(1.2); } }
  .scan-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; background: linear-gradient(90deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
  .scan-hint { color: var(--muted); font-size: 0.8rem; }
  .preview-img { max-height: 280px; max-width: 100%; border-radius: 12px; object-fit: contain; border: 2px solid rgba(177,77,255,0.4); box-shadow: 0 0 35px rgba(177,77,255,0.15); }

  .btn-identify { width: 100%; margin-top: 1.25rem; padding: 0.9rem 2rem; border: none; border-radius: 12px; font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; background: linear-gradient(135deg, var(--violet), var(--sapphire), var(--cyan)); color: white; box-shadow: 0 4px 25px rgba(177,77,255,0.35); }
  .btn-identify::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%); animation: btnShimmer 3s ease-in-out infinite; }
  @keyframes btnShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .btn-identify:hover { box-shadow: 0 6px 35px rgba(177,77,255,0.55); transform: translateY(-2px); }
  .btn-identify:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-identify:disabled::after { display: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { margin-top: 2rem; display: none; }
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .results-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; background: linear-gradient(90deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .results-meta { display: flex; gap: 0.75rem; font-size: 0.7rem; color: var(--muted); }
  .meta-tag { background: rgba(177,77,255,0.12); color: var(--violet); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.65rem; }

  .result { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1.25rem; align-items: start; transition: all 0.3s; position: relative; overflow: hidden; }
  .result::before { content: ''; position: absolute; inset: 0; border-radius: 16px; padding: 1px; background: linear-gradient(135deg, rgba(177,77,255,0.25), rgba(0,229,255,0.15), rgba(0,255,136,0.08)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.3s; }
  .result:hover::before { opacity: 1; }
  .result:first-child { border-color: rgba(255,215,0,0.3); background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(177,77,255,0.04)); }
  .result:first-child::before { opacity: 1; background: linear-gradient(135deg, rgba(255,215,0,0.35), rgba(177,77,255,0.25), rgba(0,229,255,0.15)); }
  .result:first-child::after { content: '✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧'; position: absolute; top: -1px; left: 0; right: 0; text-align: center; font-size: 0.7rem; letter-spacing: 0.5rem; color: rgba(255,215,0,0.6); animation: sparkleFloat 3s ease-in-out infinite; pointer-events: none; z-index: 2; }
  @keyframes sparkleFloat { 0%, 100% { opacity: 0.4; transform: translateY(0); } 25% { opacity: 1; transform: translateY(-3px); } 50% { opacity: 0.6; transform: translateY(1px); } 75% { opacity: 1; transform: translateY(-2px); } }

  .result-card-img { position: relative; }
  .result-thumb { width: 130px; height: 182px; object-fit: contain; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); cursor: zoom-in; transition: box-shadow 0.3s, border-color 0.3s; }

  /* #1 card — continuous floating glow animation (works on desktop AND mobile) */
  .result:first-child .result-thumb {
    border-color: rgba(255,215,0,0.5);
    animation: topCardFloat 4s ease-in-out infinite, topCardShimmer 6s ease-in-out infinite;
  }
  @keyframes topCardFloat {
    0%, 100% { transform: translateY(0); box-shadow: 0 0 25px rgba(255,215,0,0.2), 0 0 50px rgba(177,77,255,0.1); }
    50% { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(255,215,0,0.35), 0 0 70px rgba(177,77,255,0.2), 0 0 100px rgba(0,229,255,0.1); }
  }
  @keyframes topCardShimmer {
    0%, 100% { border-color: rgba(255,215,0,0.5); }
    33% { border-color: rgba(177,77,255,0.5); }
    66% { border-color: rgba(0,229,255,0.5); }
  }

  /* Desktop only — hover effects for non-#1 cards */
  @media (hover: hover) {
    .result:not(:first-child) .result-thumb:hover {
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(177,77,255,0.3), 0 0 60px rgba(0,229,255,0.15);
      border-color: rgba(177,77,255,0.5);
    }
    .result:first-child .result-thumb:hover {
      box-shadow: 0 15px 50px rgba(255,215,0,0.4), 0 0 80px rgba(177,77,255,0.3), 0 0 120px rgba(0,229,255,0.15);
    }
  }

  .rank-badge { position: absolute; top: -8px; left: -8px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 900; z-index: 1; border: 2px solid var(--bg); }
  .rank-1 { background: linear-gradient(135deg, #ffd700, #ffed4a); color: #1a1a00; font-size: 0.9rem; box-shadow: 0 0 15px rgba(255,215,0,0.5); animation: crownGlow 2s ease-in-out infinite; }
  .rank-1::after { content: '✨'; position: absolute; top: -10px; right: -10px; font-size: 0.9rem; animation: starSpin 2s ease-in-out infinite; }
  @keyframes crownGlow { 0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.5); } 50% { box-shadow: 0 0 25px rgba(255,215,0,0.8); } }
  @keyframes starSpin { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; } 50% { transform: scale(1.3) rotate(20deg); opacity: 1; } }
  .rank-2 { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #1a1a1a; box-shadow: 0 2px 10px rgba(192,192,192,0.3); }
  .rank-3 { background: linear-gradient(135deg, #cd7f32, #e8a55e); color: #1a1000; box-shadow: 0 2px 10px rgba(205,127,50,0.3); }
  .rank-other { background: var(--surface-solid); color: var(--muted); }

  .result-body { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
  .card-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: 0.02em; word-wrap: break-word; overflow-wrap: break-word; }
  .result:first-child .card-name { background: linear-gradient(90deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .card-set { font-size: 0.78rem; font-weight: 600; color: var(--cyan); }
  .card-sku { font-size: 0.65rem; color: var(--muted); font-family: var(--font-display); letter-spacing: 0.05em; word-break: break-all; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .card-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.5rem; border-radius: 4px; }
  .card-tag.rarity-common { background: rgba(140,140,140,0.12); color: #bbb; border: 1px solid rgba(140,140,140,0.2); }
  .card-tag.rarity-uncommon { background: rgba(0,255,136,0.1); color: var(--emerald); border: 1px solid rgba(0,255,136,0.25); box-shadow: 0 0 10px rgba(0,255,136,0.15); text-shadow: 0 0 4px rgba(0,255,136,0.2); }
  .card-tag.rarity-rare { background: rgba(77,142,255,0.12); color: var(--sapphire); border: 1px solid rgba(77,142,255,0.3); box-shadow: 0 0 12px rgba(77,142,255,0.2), inset 0 0 8px rgba(77,142,255,0.05); text-shadow: 0 0 6px rgba(77,142,255,0.3); }
  .card-tag.rarity-mythic, .card-tag.rarity-secret { background: rgba(255,45,111,0.12); color: var(--ruby); border: 1px solid rgba(255,45,111,0.3); box-shadow: 0 0 12px rgba(255,45,111,0.2), inset 0 0 8px rgba(255,45,111,0.05); text-shadow: 0 0 6px rgba(255,45,111,0.3); animation: mythicPulse 2.5s ease-in-out infinite; }
  @keyframes mythicPulse { 0%, 100% { box-shadow: 0 0 12px rgba(255,45,111,0.2); } 50% { box-shadow: 0 0 20px rgba(255,45,111,0.4); } }
  .card-tag.rarity-ultra { background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 0 12px rgba(255,215,0,0.2); text-shadow: 0 0 6px rgba(255,215,0,0.3); }
  .card-tag:not([class*="rarity"]) { background: rgba(177,77,255,0.08); color: var(--violet); border: 1px solid rgba(177,77,255,0.2); }

  .card-prices { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .price-chip { display: flex; align-items: baseline; gap: 0.3rem; padding: 0.25rem 0.55rem; border-radius: 8px; background: rgba(0,255,136,0.05); border: 1px solid rgba(0,255,136,0.15); }
  .price-source { font-size: 0.5rem; font-weight: 600; text-transform: uppercase; color: var(--muted); }
  .price-value { font-size: 0.8rem; font-weight: 800; color: var(--emerald); font-family: var(--font-display); }

  .marketplace { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; padding-top: 0.5rem; border-top: 1px solid rgba(255,255,255,0.05); }
  .mp-link { font-size: 0.65rem; font-weight: 600; padding: 0.25rem 0.55rem; border-radius: 6px; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.2rem; }
  .mp-buy { color: var(--emerald); background: rgba(0,255,136,0.05); border: 1px solid rgba(0,255,136,0.15); }
  .mp-buy:hover { background: rgba(0,255,136,0.15); border-color: rgba(0,255,136,0.35); box-shadow: 0 0 12px rgba(0,255,136,0.12); }
  .mp-sell { color: var(--gold); background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.15); }
  .mp-sell:hover { background: rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.35); box-shadow: 0 0 12px rgba(255,215,0,0.12); }

  .xrefs { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
  .xref-link { font-size: 0.65rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 4px; text-decoration: none; background: rgba(77,142,255,0.05); border: 1px solid rgba(77,142,255,0.15); color: var(--sapphire); transition: all 0.2s; }
  .xref-link:hover { background: rgba(77,142,255,0.15); box-shadow: 0 0 10px rgba(77,142,255,0.12); }

  .confidence { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; min-width: 70px; }
  .conf-ring { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .conf-ring svg { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
  .conf-ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .conf-ring .track { stroke: rgba(255,255,255,0.06); }
  .conf-ring .fill-high { stroke: var(--emerald); filter: drop-shadow(0 0 10px rgba(0,255,136,0.6)); }
  .conf-ring .fill-mid { stroke: var(--gold); filter: drop-shadow(0 0 10px rgba(255,215,0,0.6)); }
  .conf-ring .fill-low { stroke: var(--ruby); filter: drop-shadow(0 0 10px rgba(255,45,111,0.6)); }
  .conf-pct { font-family: var(--font-display); font-size: 0.85rem; font-weight: 900; z-index: 1; }
  .conf-pct.high { color: var(--emerald); text-shadow: 0 0 15px rgba(0,255,136,0.4); }
  .conf-pct.mid { color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.4); }
  .conf-pct.low { color: var(--ruby); text-shadow: 0 0 15px rgba(255,45,111,0.4); }
  .conf-label { font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  .error-msg { background: rgba(255,45,111,0.08); border: 1px solid rgba(255,45,111,0.2); color: var(--ruby); padding: 1rem; border-radius: 12px; margin-top: 1rem; font-size: 0.82rem; }
  .json-toggle { color: var(--muted); font-size: 0.7rem; cursor: pointer; margin-top: 1rem; opacity: 0.5; transition: all 0.2s; }
  .json-toggle:hover { opacity: 1; color: var(--cyan); }
  .json-raw { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-top: 0.5rem; font-family: 'Courier New', monospace; font-size: 0.65rem; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; display: none; color: var(--muted); }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(26,24,48,0.95); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; backdrop-filter: blur(12px); }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 14px; box-shadow: 0 0 80px rgba(177,77,255,0.25), 0 0 40px rgba(0,229,255,0.15); }
  .lightbox-label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: var(--cyan); font-size: 0.75rem; font-family: var(--font-display); background: var(--surface-solid); padding: 0.4rem 1.2rem; border-radius: 8px; border: 1px solid rgba(0,229,255,0.25); letter-spacing: 0.05em; }

  .footer { text-align: center; margin-top: 2rem; padding: 1.25rem; border-top: 1px solid var(--border); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .footer span { background: linear-gradient(90deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }

  /* ── Mobile fixes ── */
  @media (max-width: 700px) {
    .header { flex-direction: column; padding: 0.75rem 1rem; }
    .header-controls { width: 100%; }
    .ctrl-input { width: 100%; max-width: 160px; }
    .main { padding: 0.75rem; }
    .scan-area { padding: 2.5rem 1rem; border-radius: 14px; }
    .scan-title { font-size: 0.9rem; }
    .result { grid-template-columns: auto 1fr; gap: 0.75rem; padding: 1rem; }
    .confidence { display: none; }
    .result-thumb { width: 85px; height: 119px; }
    .result:first-child .result-thumb { width: 90px; height: 126px; }
    .card-name { font-size: 0.85rem; }
    .card-set { font-size: 0.7rem; }
    .card-sku { font-size: 0.6rem; }
    .card-tag { font-size: 0.55rem; padding: 0.15rem 0.4rem; }
    .price-value { font-size: 0.72rem; }
    .mp-link { font-size: 0.6rem; padding: 0.2rem 0.45rem; }
    .orb { display: none; }
    .result:first-child::after { font-size: 0.55rem; letter-spacing: 0.3rem; }
  }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="content">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">MATCHIT</span>
      <span class="logo-badge">Card ID</span>
    </div>
    <div class="header-controls">
      <div class="ctrl-group"><span class="ctrl-label">Endpoint</span><input class="ctrl-input" type="text" id="apiUrl" value=""></div>
      <div class="ctrl-group"><span class="ctrl-label">API Key</span><input class="ctrl-input" type="password" id="apiKey" value=""></div>
      <div class="ctrl-group"><span class="ctrl-label">Vertical</span><select class="ctrl-select" id="verticalSelect" onchange="switchVertical()"><option value="">Loading...</option></select></div>
      <div class="ctrl-group"><span class="ctrl-label">Results</span><select class="ctrl-select" id="topK"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></div>
    </div>
  </div>

  <div class="main">
    <div class="scan-area" id="uploadArea">
      <input type="file" id="imageInput" accept="image/*">
      <div id="uploadPlaceholder">
        <div class="scan-icon">🃏</div>
        <div class="scan-title">IDENTIFY YOUR CARD</div>
        <div class="scan-hint">Tap to photograph · Select from gallery · Drag & drop</div>
      </div>
      <img id="previewImg" class="preview-img" style="display:none;cursor:zoom-in;" onclick="openLightbox(this.src,'Your card')">
    </div>
    <button class="btn-identify" id="matchBtn" disabled>⚡ Identify Card</button>
    <div class="results" id="resultsSection">
      <div class="results-header">
        <span class="results-title">✦ Results</span>
        <div class="results-meta" id="responseMeta"></div>
      </div>
      <div id="resultsList"></div>
      <div class="json-toggle" onclick="toggleJson()">▸ Raw API Response</div>
      <pre class="json-raw" id="jsonRaw"></pre>
    </div>
    <div id="errorArea"></div>
    <div class="footer">Powered by <span>MatchIT</span> Visual Identification Engine</div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
  <div class="lightbox-label" id="lightboxLabel"></div>
</div>

<script>
// Auto-detect API base
const API_BASE = window.location.origin + '/api/v1';
document.getElementById('apiUrl').value = API_BASE + '/match';

const uploadArea=document.getElementById('uploadArea'),imageInput=document.getElementById('imageInput'),previewImg=document.getElementById('previewImg'),placeholder=document.getElementById('uploadPlaceholder'),matchBtn=document.getElementById('matchBtn'),resultsSection=document.getElementById('resultsSection'),resultsList=document.getElementById('resultsList'),responseMeta=document.getElementById('responseMeta'),errorArea=document.getElementById('errorArea'),jsonRaw=document.getElementById('jsonRaw');
let selectedFile=null;

async function loadVerticals(){
  try{
    const r=await fetch(API_BASE+'/verticals',{headers:{'ngrok-skip-browser-warning':'1'}});
    const d=await r.json();
    const s=document.getElementById('verticalSelect');
    s.innerHTML='';
    for(const v of d.verticals){const o=document.createElement('option');o.value=v.id;o.textContent=(v.icon||'')+' '+v.name;s.appendChild(o);}
    const h=await fetch(API_BASE+'/health',{headers:{'ngrok-skip-browser-warning':'1'}});
    const hd=await h.json();
    s.value=hd.vertical;
  }catch(e){console.error('Verticals:',e);}
}

async function switchVertical(){
  const k=document.getElementById('apiKey').value.trim(),v=document.getElementById('verticalSelect').value;
  if(!k||!v)return;
  try{
    const fd=new FormData();fd.append('vertical',v);
    const r=await fetch(API_BASE+'/switch_vertical',{method:'POST',headers:{'X-API-Key':k,'ngrok-skip-browser-warning':'1'},body:fd});
    const d=await r.json();
    if(d.status==='switched'){resultsSection.style.display='none';errorArea.innerHTML='<div style="color:#00e5ff;font-size:0.8rem;margin-top:0.5rem;letter-spacing:0.05em;">⚡ '+d.vertical_name+' — '+d.front_embeddings+' loaded</div>';setTimeout(function(){errorArea.innerHTML='';},3000);}
  }catch(e){showError(e.message);}
}

window.addEventListener('load',function(){setTimeout(loadVerticals,500);});
uploadArea.addEventListener('dragover',function(e){e.preventDefault();uploadArea.classList.add('dragover');});
uploadArea.addEventListener('dragleave',function(){uploadArea.classList.remove('dragover');});
uploadArea.addEventListener('drop',function(e){e.preventDefault();uploadArea.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
imageInput.addEventListener('change',function(e){if(e.target.files.length)handleFile(e.target.files[0]);});

function handleFile(f){selectedFile=f;const r=new FileReader();r.onload=function(e){previewImg.src=e.target.result;previewImg.style.display='block';placeholder.style.display='none';uploadArea.classList.add('has-image');matchBtn.disabled=false;};r.readAsDataURL(f);}

matchBtn.addEventListener('click',async function(){
  if(!selectedFile)return;
  const u=document.getElementById('apiUrl').value.trim(),k=document.getElementById('apiKey').value.trim();
  if(!k){showError('Enter your API key');return;}
  matchBtn.disabled=true;matchBtn.innerHTML='<span class="spinner"></span> SCANNING...';errorArea.innerHTML='';resultsSection.style.display='none';
  const fd=new FormData();fd.append('image',selectedFile);fd.append('top_k',document.getElementById('topK').value);fd.append('include_diagnostics','true');
  try{
    const r=await fetch(u,{method:'POST',headers:{'X-API-Key':k,'ngrok-skip-browser-warning':'1'},body:fd});
    const d=await r.json();
    if(!r.ok){showError(d.error||'HTTP '+r.status);return;}
    renderResults(d);
  }catch(e){showError(e.message);}
  finally{matchBtn.disabled=false;matchBtn.textContent='⚡ Identify Card';}
});

function getCurrency(s){s=(s||'').toLowerCase();if(s.indexOf('cardmarket')>=0)return'€';return'$';}
function toGBP(usd){return(usd*0.79).toFixed(2);}
function rarityClass(r){if(!r)return'';r=r.toLowerCase();if(r.indexOf('common')>=0&&r.indexOf('uncommon')<0)return'rarity-common';if(r.indexOf('uncommon')>=0)return'rarity-uncommon';if(r.indexOf('mythic')>=0||r.indexOf('secret')>=0||r.indexOf('ultra')>=0)return'rarity-mythic';if(r.indexOf('rare')>=0||r.indexOf('holo')>=0)return'rarity-rare';return'';}

function renderResults(data){
  responseMeta.innerHTML='<span>⏱ '+data.timing_ms+'ms</span><span class="meta-tag">'+(data.vertical||'?')+'</span>';
  let html='';
  for(let i=0;i<data.matches.length;i++){
    const m=data.matches[i];
    const rawSim=m.similarity||m.score||m.probability;
    const pct=Math.min(100,Math.max(0,Math.round(((rawSim-0.80)/0.18)*100)));
    const level=pct>=75?'high':pct>=45?'mid':'low';
    const circ=2*Math.PI*26,dash=circ-(circ*pct/100);
    let imgSrc='';if(m.images&&m.images.length>0)imgSrc=window.location.origin+'/api/v1/image/'+m.images[0].image_id;
    const p=m.profile||{},cardName=p.name||p.title||'',setName=p.set_name||'',cardNumber=p.card_number||'',rarity=p.rarity||'';

    let tagsHtml='';
    if(rarity)tagsHtml+='<span class="card-tag '+rarityClass(rarity)+'">'+rarity.replace(/_/g,' ')+'</span>';
    if(p.energy_type)tagsHtml+='<span class="card-tag">'+p.energy_type.replace(/_/g,' ')+'</span>';
    if(p.mtg_color)tagsHtml+='<span class="card-tag">'+p.mtg_color.replace(/_/g,' ')+'</span>';
    if(p.ygo_card_type)tagsHtml+='<span class="card-tag">'+p.ygo_card_type.replace(/_/g,' ')+'</span>';
    if(p.set_era)tagsHtml+='<span class="card-tag">'+p.set_era.replace(/_/g,' ')+'</span>';
    if(p.type_line)tagsHtml+='<span class="card-tag">'+p.type_line+'</span>';

    let pricesHtml='';
    if(p.prices&&typeof p.prices==='object'){
      const sources=Object.keys(p.prices);
      for(let si=0;si<sources.length;si++){
        const source=sources[si],sdata=p.prices[source];
        if(!sdata||typeof sdata!=='object')continue;
        let best=null;
        const variants=Object.keys(sdata);
        for(let vi=0;vi<variants.length;vi++){
          const vdata=sdata[variants[vi]];
          if(vdata&&typeof vdata==='object'){const pr=vdata.market||vdata.trend||vdata.avg_sell||vdata.mid;if(pr&&(!best||pr<best))best=pr;}
          else if(typeof vdata==='number'&&vdata>0){if(!best||vdata<best)best=vdata;}
        }
        if(best){
          const curr=getCurrency(source),val=Number(best).toFixed(2);
          const gbp=curr==='$'?' (~£'+toGBP(best)+')':curr==='€'?' (~£'+(best*0.86).toFixed(2)+')':'';
          pricesHtml+='<div class="price-chip"><span class="price-source">'+source+'</span><span class="price-value">'+curr+val+gbp+'</span></div>';
        }
      }
    }

    let mpHtml='';
    if(cardName){
      const st=(cardName+' '+setName+' '+cardNumber).trim(),enc=encodeURIComponent(st);
      mpHtml='<a class="mp-link mp-buy" href="https://www.google.com/search?q=site:bigorbitcards.co.uk+'+enc+'" target="_blank">🇬🇧 Big Orbit</a>';
      mpHtml+='<a class="mp-link mp-sell" href="https://www.google.com/search?q=site:bigorbitcards.co.uk+sell+'+enc+'" target="_blank">💷 Sell</a>';
      if(p.tcgplayer_url)mpHtml+='<a class="mp-link mp-buy" href="'+p.tcgplayer_url+'" target="_blank">🇺🇸 TCGPlayer</a>';
      else mpHtml+='<a class="mp-link mp-buy" href="https://www.tcgplayer.com/search/all/product?q='+enc+'" target="_blank">🇺🇸 TCGPlayer</a>';
      if(p.cardmarket_url)mpHtml+='<a class="mp-link mp-buy" href="'+p.cardmarket_url+'" target="_blank">🇪🇺 Cardmarket</a>';
      else mpHtml+='<a class="mp-link mp-buy" href="https://www.cardmarket.com/en/Pokemon/Products/Search?searchString='+enc+'" target="_blank">🇪🇺 Cardmarket</a>';
      mpHtml+='<a class="mp-link mp-buy" href="https://www.google.com/search?q=site:cardtrader.com+'+enc+'" target="_blank">🔄 CardTrader</a>';
      mpHtml+='<a class="mp-link mp-buy" href="https://totalcards.net/search?q='+enc+'" target="_blank">🇬🇧 Total Cards</a>';
      mpHtml+='<a class="mp-link mp-buy" href="https://www.miniaturemarket.com/searchresults?q='+enc+'" target="_blank">🇺🇸 Miniature Market</a>';
    }

    let xrefHtml='';
    if(p.crossrefs&&Array.isArray(p.crossrefs)){
      for(let xi=0;xi<p.crossrefs.length;xi++){
        const x=p.crossrefs[xi],b=x.brand.toLowerCase(),lb=b==='hd'?'HD (Davenport)':x.brand.toUpperCase();
        const u=b==='hd'?'https://www.davenport-burgess.com/search/'+encodeURIComponent(x.code):b==='jma'?'https://jma-uk.co.uk/catalogsearch/result/?q='+encodeURIComponent(x.code):b==='silca'?'https://www.aldridgesecurity.co.uk/catalogsearch/result/?q='+encodeURIComponent(x.code):'https://www.google.com/search?q='+x.brand+'+'+encodeURIComponent(x.code)+'+key+blank';
        xrefHtml+='<a class="xref-link" href="'+u+'" target="_blank">'+lb+': '+x.code+'</a>';
      }
    }

    let genLinks='';
    if(!cardName){const keys=Object.keys(p);for(let gi=0;gi<keys.length;gi++){const gv=p[keys[gi]];if(typeof gv==='string'&&gv.indexOf('http')===0){const gl=keys[gi].replace(/_url/g,'').replace(/_/g,' ').trim()||'Link';genLinks+='<a class="mp-link mp-buy" href="'+gv+'" target="_blank">'+gl.charAt(0).toUpperCase()+gl.slice(1)+'</a>';}}}

    const rc=m.rank<=3?'rank-'+m.rank:'rank-other';
    const safeName=(cardName||m.sku).replace(/'/g,"\\'");
    html+='<div class="result">';
    html+='<div class="result-card-img">';
    html+='<div class="rank-badge '+rc+'">'+(m.rank===1?'👑':'#'+m.rank)+'</div>';
    if(imgSrc)html+='<img class="result-thumb" src="'+imgSrc+'" onclick="openLightbox(\''+imgSrc+'\',\''+safeName+'\')">';
    html+='</div>';
    html+='<div class="result-body">';
    if(cardName)html+='<div class="card-name">'+cardName+'</div>';
    if(setName)html+='<div class="card-set">'+setName+(cardNumber?' #'+cardNumber:'')+'</div>';
    html+='<div class="card-sku">'+m.sku+'</div>';
    if(tagsHtml)html+='<div class="card-tags">'+tagsHtml+'</div>';
    if(pricesHtml)html+='<div class="card-prices">'+pricesHtml+'</div>';
    if(mpHtml)html+='<div class="marketplace">'+mpHtml+'</div>';
    if(xrefHtml)html+='<div class="xrefs">'+xrefHtml+'</div>';
    if(genLinks)html+='<div class="marketplace">'+genLinks+'</div>';
    html+='</div>';
    html+='<div class="confidence"><div class="conf-ring"><svg viewBox="0 0 60 60"><circle class="track" cx="30" cy="30" r="26"/><circle class="fill-'+level+'" cx="30" cy="30" r="26" stroke-dasharray="'+circ+'" stroke-dashoffset="'+dash+'"/></svg><span class="conf-pct '+level+'">'+pct+'%</span></div><span class="conf-label">Match</span></div>';
    html+='</div>';
  }
  resultsList.innerHTML=html;
  jsonRaw.textContent=JSON.stringify(data,null,2);
  resultsSection.style.display='block';
}

function showError(m){errorArea.innerHTML='<div class="error-msg">'+m+'</div>';}
function toggleJson(){jsonRaw.style.display=jsonRaw.style.display==='none'?'block':'none';}
function openLightbox(s,l){document.getElementById('lightboxImg').src=s;document.getElementById('lightboxLabel').textContent=l||'';document.getElementById('lightbox').classList.add('active');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');document.getElementById('lightboxImg').src='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});
</script>
</body>
</html>
