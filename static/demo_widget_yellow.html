<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIT — Card Identifier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffd60a;
    --bg-warm: #ffcc00;
    --bg-light: #ffe55c;
    --surface: rgba(255,255,255,0.85);
    --surface-solid: #ffffff;
    --surface-dark: #1a1a2e;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text: #1a1a2e;
    --text-light: #333352;
    --muted: #6b6b8a;
    --gold: #b8860b;
    --gold-bright: #ffd700;
    --emerald: #059669;
    --emerald-bright: #10b981;
    --ruby: #dc2626;
    --ruby-bright: #ef4444;
    --sapphire: #2563eb;
    --violet: #7c3aed;
    --violet-bright: #a855f7;
    --cyan: #0891b2;
    --orange: #ea580c;
    --font-display: 'Orbitron', monospace;
    --font-body: 'DM Sans', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-canvas {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(135deg, #ffd60a 0%, #ffcc00 30%, #ffe55c 60%, #fff3a0 100%);
  }
  .bg-canvas::before {
    content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.4) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 80%, rgba(255,165,0,0.15) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, rgba(255,69,0,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 10% 80%, rgba(255,255,255,0.3) 0%, transparent 35%);
    animation: bgDrift 20s ease-in-out infinite alternate;
  }
  .bg-canvas::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255,255,255,0.08) 40px, rgba(255,255,255,0.08) 42px);
  }
  @keyframes bgDrift { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(-2%,-1%) rotate(1deg); } }

  .orb { position: absolute; border-radius: 50%; filter: blur(60px); animation: orbFloat 18s ease-in-out infinite alternate; }
  .orb-1 { width: 350px; height: 350px; background: rgba(255,165,0,0.2); top: -8%; left: -5%; }
  .orb-2 { width: 300px; height: 300px; background: rgba(255,255,255,0.4); bottom: -8%; right: -5%; animation-delay: -5s; }
  .orb-3 { width: 250px; height: 250px; background: rgba(255,69,0,0.08); top: 50%; left: 70%; animation-delay: -10s; }
  .orb-4 { width: 200px; height: 200px; background: rgba(255,255,255,0.3); top: 30%; left: 5%; animation-delay: -7s; }
  @keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(25px,-15px) scale(1.08); } 100% { transform: translate(-15px,25px) scale(0.95); } }

  .content { position: relative; z-index: 1; }

  .header {
    padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid rgba(0,0,0,0.1);
    background: rgba(255,255,255,0.6); backdrop-filter: blur(20px);
  }
  .logo { display: flex; align-items: center; gap: 0.75rem; }
  .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #1a1a2e, #2d2d5e); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
  .logo-text { font-family: var(--font-display); font-size: 1.2rem; font-weight: 900; background: linear-gradient(90deg, #b14dff, #00e5ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.05em; }
  .logo-badge { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: white; background: linear-gradient(135deg, var(--ruby), var(--orange)); padding: 0.15rem 0.5rem; border-radius: 3px; }
  .header-controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .ctrl-group { display: flex; flex-direction: column; gap: 0.15rem; }
  .ctrl-label { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .ctrl-input, .ctrl-select { background: rgba(255,255,255,0.8); border: 1px solid var(--border-strong); color: var(--text); padding: 0.35rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-family: var(--font-body); transition: all 0.2s; }
  .ctrl-input:focus, .ctrl-select:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  .ctrl-input { width: 180px; }

  .main { max-width: 1000px; margin: 0 auto; padding: 2rem; }

  .scan-area { position: relative; border: 3px dashed rgba(26,26,46,0.2); border-radius: 20px; padding: 3.5rem 2rem; text-align: center; cursor: pointer; transition: all 0.4s; background: rgba(255,255,255,0.5); backdrop-filter: blur(20px); overflow: hidden; }
  .scan-area::before { content: ''; position: absolute; inset: -3px; border-radius: 23px; background: linear-gradient(135deg, var(--violet), var(--sapphire), var(--emerald-bright), var(--orange)); z-index: -1; opacity: 0; transition: opacity 0.4s; }
  .scan-area:hover::before { opacity: 0.5; }
  .scan-area:hover { border-color: transparent; background: rgba(255,255,255,0.7); }
  .scan-area.has-image { padding: 1.5rem; border-style: solid; border-color: var(--violet); background: rgba(255,255,255,0.7); }
  .scan-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }
  .scan-icon { font-size: 3.5rem; margin-bottom: 0.75rem; animation: scanPulse 3s ease-in-out infinite; }
  @keyframes scanPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .scan-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--surface-dark); margin-bottom: 0.3rem; }
  .scan-hint { color: var(--muted); font-size: 0.8rem; }
  .preview-img { max-height: 280px; max-width: 100%; border-radius: 12px; object-fit: contain; border: 3px solid var(--violet); box-shadow: 0 8px 30px rgba(124,58,237,0.15); }

  .btn-identify { width: 100%; margin-top: 1.25rem; padding: 0.9rem 2rem; border: none; border-radius: 12px; font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; background: linear-gradient(135deg, #1a1a2e, #2d2d5e, #1a1a2e); color: var(--gold-bright); box-shadow: 0 4px 20px rgba(26,26,46,0.3); }
  .btn-identify::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent 30%, rgba(255,215,0,0.15) 50%, transparent 70%); animation: btnShimmer 3s ease-in-out infinite; }
  @keyframes btnShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .btn-identify:hover { box-shadow: 0 6px 30px rgba(26,26,46,0.45); transform: translateY(-2px); }
  .btn-identify:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-identify:disabled::after { display: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,215,0,0.3); border-top-color: var(--gold-bright); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { margin-top: 2.5rem; display: none; }
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 2px solid rgba(0,0,0,0.08); }
  .results-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--surface-dark); }
  .results-meta { display: flex; gap: 0.75rem; font-size: 0.7rem; color: var(--muted); }
  .meta-tag { background: rgba(124,58,237,0.1); color: var(--violet); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.65rem; }

  .result { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border-strong); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1.5rem; align-items: start; transition: all 0.3s; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .result:hover { box-shadow: 0 8px 35px rgba(0,0,0,0.1); transform: translateY(-2px); border-color: var(--violet); }
  .result:first-child { border: 2px solid var(--violet); background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(124,58,237,0.03)); box-shadow: 0 6px 30px rgba(124,58,237,0.12); }
  .result:first-child::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold-bright), var(--orange), var(--ruby-bright), var(--violet-bright)); }
  .result:first-child::after { content: '✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧'; position: absolute; top: -1px; left: 0; right: 0; text-align: center; font-size: 0.7rem; letter-spacing: 0.5rem; color: rgba(255,215,0,0.6); animation: sparkleFloat 3s ease-in-out infinite; pointer-events: none; z-index: 2; }
  @keyframes sparkleFloat { 0%, 100% { opacity: 0.4; transform: translateY(0); } 25% { opacity: 1; transform: translateY(-3px); } 50% { opacity: 0.6; transform: translateY(1px); } 75% { opacity: 1; transform: translateY(-2px); } }

  .result-card-img { position: relative; }
  .result-thumb { width: 130px; height: 182px; object-fit: contain; border-radius: 10px; background: #f5f5f5; border: 2px solid var(--border-strong); cursor: zoom-in; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
  .result-thumb:hover { transform: scale(1.12) rotate(-3deg); box-shadow: 0 15px 40px rgba(0,0,0,0.15), 0 0 30px rgba(124,58,237,0.2), 0 0 60px rgba(255,165,0,0.1); border-color: var(--violet); }
  .result:first-child .result-thumb { border-color: var(--violet); box-shadow: 0 6px 25px rgba(124,58,237,0.2); animation: topCardGlow 3s ease-in-out infinite; }
  @keyframes topCardGlow { 0%, 100% { box-shadow: 0 6px 25px rgba(124,58,237,0.2); } 50% { box-shadow: 0 8px 35px rgba(124,58,237,0.35), 0 0 20px rgba(255,165,0,0.1); } }

  .rank-badge { position: absolute; top: -8px; left: -8px; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 900; z-index: 1; border: 3px solid white; box-shadow: 0 3px 12px rgba(0,0,0,0.2); }
  .rank-1 { background: linear-gradient(135deg, #ffd700, #ffed4a); color: #5a4000; font-size: 1rem; animation: crownGlow 2s ease-in-out infinite; }
  .rank-1::after { content: '✨'; position: absolute; top: -10px; right: -10px; font-size: 0.9rem; animation: starSpin 2s ease-in-out infinite; }
  @keyframes crownGlow { 0%, 100% { box-shadow: 0 3px 12px rgba(255,215,0,0.4); } 50% { box-shadow: 0 3px 20px rgba(255,215,0,0.7); } }
  @keyframes starSpin { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; } 50% { transform: scale(1.3) rotate(20deg); opacity: 1; } }
  .rank-2 { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #333; }
  .rank-3 { background: linear-gradient(135deg, #cd7f32, #e8a55e); color: #3a2000; }
  .rank-other { background: #eee; color: #888; }

  .result-body { display: flex; flex-direction: column; gap: 0.5rem; }
  .card-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: 0.02em; }
  .result:first-child .card-name { color: var(--violet); }
  .card-set { font-size: 0.78rem; font-weight: 600; color: var(--sapphire); }
  .card-sku { font-size: 0.65rem; color: var(--muted); font-family: var(--font-display); letter-spacing: 0.05em; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .card-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.55rem; border-radius: 4px; }
  .card-tag.rarity-common { background: #f0f0f0; color: #777; border: 1px solid #ddd; }
  .card-tag.rarity-uncommon { background: rgba(16,185,129,0.1); color: var(--emerald); border: 1px solid rgba(16,185,129,0.25); box-shadow: 0 0 8px rgba(16,185,129,0.1); }
  .card-tag.rarity-rare { background: rgba(37,99,235,0.08); color: var(--sapphire); border: 1px solid rgba(37,99,235,0.2); box-shadow: 0 0 10px rgba(37,99,235,0.1); }
  .card-tag.rarity-mythic, .card-tag.rarity-secret { background: rgba(220,38,38,0.08); color: var(--ruby); border: 1px solid rgba(220,38,38,0.2); box-shadow: 0 0 10px rgba(220,38,38,0.1); animation: mythicPulse 2.5s ease-in-out infinite; }
  @keyframes mythicPulse { 0%, 100% { box-shadow: 0 0 10px rgba(220,38,38,0.1); } 50% { box-shadow: 0 0 18px rgba(220,38,38,0.25); } }
  .card-tag.rarity-ultra { background: rgba(255,165,0,0.1); color: var(--orange); border: 1px solid rgba(255,165,0,0.25); box-shadow: 0 0 10px rgba(255,165,0,0.1); }
  .card-tag:not([class*="rarity"]) { background: rgba(124,58,237,0.06); color: var(--violet); border: 1px solid rgba(124,58,237,0.15); }

  .card-prices { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .price-chip { display: flex; align-items: baseline; gap: 0.3rem; padding: 0.3rem 0.65rem; border-radius: 8px; background: rgba(5,150,105,0.06); border: 1px solid rgba(5,150,105,0.15); }
  .price-source { font-size: 0.55rem; font-weight: 600; text-transform: uppercase; color: var(--muted); }
  .price-value { font-size: 0.85rem; font-weight: 800; color: var(--emerald); font-family: var(--font-display); }

  .marketplace { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; padding-top: 0.6rem; border-top: 1px solid rgba(0,0,0,0.06); }
  .mp-link { font-size: 0.68rem; font-weight: 600; padding: 0.3rem 0.65rem; border-radius: 6px; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.25rem; }
  .mp-buy { color: var(--emerald); background: rgba(5,150,105,0.06); border: 1px solid rgba(5,150,105,0.15); }
  .mp-buy:hover { background: rgba(5,150,105,0.12); border-color: rgba(5,150,105,0.3); box-shadow: 0 2px 10px rgba(5,150,105,0.1); }
  .mp-sell { color: var(--orange); background: rgba(234,88,12,0.06); border: 1px solid rgba(234,88,12,0.15); }
  .mp-sell:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.3); box-shadow: 0 2px 10px rgba(234,88,12,0.1); }

  .xrefs { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
  .xref-link { font-size: 0.68rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 4px; text-decoration: none; background: rgba(37,99,235,0.06); border: 1px solid rgba(37,99,235,0.15); color: var(--sapphire); transition: all 0.2s; }
  .xref-link:hover { background: rgba(37,99,235,0.12); }

  .confidence { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; min-width: 80px; }
  .conf-ring { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(255,255,255,0.5); }
  .conf-ring svg { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
  .conf-ring circle { fill: none; stroke-width: 3.5; stroke-linecap: round; }
  .conf-ring .track { stroke: rgba(0,0,0,0.06); }
  .conf-ring .fill-high { stroke: var(--emerald); filter: drop-shadow(0 0 8px rgba(5,150,105,0.4)); }
  .conf-ring .fill-mid { stroke: var(--orange); filter: drop-shadow(0 0 8px rgba(234,88,12,0.4)); }
  .conf-ring .fill-low { stroke: var(--ruby); filter: drop-shadow(0 0 8px rgba(220,38,38,0.4)); }
  .conf-pct { font-family: var(--font-display); font-size: 0.95rem; font-weight: 900; z-index: 1; }
  .conf-pct.high { color: var(--emerald); }
  .conf-pct.mid { color: var(--orange); }
  .conf-pct.low { color: var(--ruby); }
  .conf-label { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  .error-msg { background: rgba(220,38,38,0.06); border: 1px solid rgba(220,38,38,0.15); color: var(--ruby); padding: 1rem; border-radius: 12px; margin-top: 1rem; font-size: 0.82rem; }
  .json-toggle { color: var(--muted); font-size: 0.7rem; cursor: pointer; margin-top: 1rem; opacity: 0.5; transition: all 0.2s; }
  .json-toggle:hover { opacity: 1; color: var(--violet); }
  .json-raw { background: var(--surface-dark); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-top: 0.5rem; font-family: 'Courier New', monospace; font-size: 0.65rem; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; display: none; color: #aaa; }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(26,26,46,0.92); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; backdrop-filter: blur(12px); }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 14px; box-shadow: 0 0 60px rgba(124,58,237,0.2); }
  .lightbox-label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: var(--gold-bright); font-size: 0.75rem; font-family: var(--font-display); background: var(--surface-dark); padding: 0.4rem 1.2rem; border-radius: 8px; letter-spacing: 0.05em; }

  .footer { text-align: center; margin-top: 3rem; padding: 1.5rem; border-top: 2px solid rgba(0,0,0,0.08); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(26,26,46,0.5); }
  .footer span { background: linear-gradient(90deg, #b14dff, #00e5ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }

  @media (max-width: 700px) {
    .header { flex-direction: column; padding: 1rem; }
    .ctrl-input { width: 140px; }
    .main { padding: 1rem; }
    .result { grid-template-columns: auto 1fr; gap: 1rem; padding: 1rem; }
    .confidence { display: none; }
    .result-thumb { width: 95px; height: 133px; }
    .card-name { font-size: 0.9rem; }
    .orb { display: none; }
  }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="content">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">MATCHIT</span>
      <span class="logo-badge">Card ID</span>
    </div>
    <div class="header-controls">
      <div class="ctrl-group"><span class="ctrl-label">Endpoint</span><input class="ctrl-input" type="text" id="apiUrl" value=""></div>
      <div class="ctrl-group"><span class="ctrl-label">API Key</span><input class="ctrl-input" type="password" id="apiKey" value=""></div>
      <div class="ctrl-group"><span class="ctrl-label">Vertical</span><select class="ctrl-select" id="verticalSelect" onchange="switchVertical()"><option value="">Loading...</option></select></div>
      <div class="ctrl-group"><span class="ctrl-label">Results</span><select class="ctrl-select" id="topK"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></div>
    </div>
  </div>

  <div class="main">
    <div class="scan-area" id="uploadArea">
      <input type="file" id="imageInput" accept="image/*">
      <div id="uploadPlaceholder">
        <div class="scan-icon">🃏</div>
        <div class="scan-title">IDENTIFY YOUR CARD</div>
        <div class="scan-hint">Tap to photograph · Select from gallery · Drag & drop</div>
      </div>
      <img id="previewImg" class="preview-img" style="display:none;cursor:zoom-in;" onclick="openLightbox(this.src,'Your card')">
    </div>
    <button class="btn-identify" id="matchBtn" disabled>⚡ Identify Card</button>
    <div class="results" id="resultsSection">
      <div class="results-header">
        <span class="results-title">✦ Results</span>
        <div class="results-meta" id="responseMeta"></div>
      </div>
      <div id="resultsList"></div>
      <div class="json-toggle" onclick="toggleJson()">▸ Raw API Response</div>
      <pre class="json-raw" id="jsonRaw"></pre>
    </div>
    <div id="errorArea"></div>
    <div class="footer">Powered by <span>MatchIT</span> Visual Identification Engine</div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
  <div class="lightbox-label" id="lightboxLabel"></div>
</div>

<script>
// ── Auto-detect API base from current page URL ──
const API_BASE = window.location.origin + '/api/v1';
document.getElementById('apiUrl').value = API_BASE + '/match';

// Common fetch headers for ngrok compatibility
const HEADERS = {'ngrok-skip-browser-warning': '1'};

const uploadArea=document.getElementById('uploadArea'),imageInput=document.getElementById('imageInput'),previewImg=document.getElementById('previewImg'),placeholder=document.getElementById('uploadPlaceholder'),matchBtn=document.getElementById('matchBtn'),resultsSection=document.getElementById('resultsSection'),resultsList=document.getElementById('resultsList'),responseMeta=document.getElementById('responseMeta'),errorArea=document.getElementById('errorArea'),jsonRaw=document.getElementById('jsonRaw');
let selectedFile=null;

async function loadVerticals(){
  try{
    const r=await fetch(API_BASE+'/verticals',{headers:HEADERS});
    const d=await r.json();
    const s=document.getElementById('verticalSelect');
    s.innerHTML='';
    for(const v of d.verticals){const o=document.createElement('option');o.value=v.id;o.textContent=`${v.icon} ${v.name}`.trim();s.appendChild(o);}
    const h=await fetch(API_BASE+'/health',{headers:HEADERS});
    const hd=await h.json();
    s.value=hd.vertical;
  }catch(e){console.error('Verticals:',e);}
}

async function switchVertical(){
  const k=document.getElementById('apiKey').value.trim(),v=document.getElementById('verticalSelect').value;
  if(!k||!v)return;
  try{
    const fd=new FormData();fd.append('vertical',v);
    const r=await fetch(API_BASE+'/switch_vertical',{method:'POST',headers:{'X-API-Key':k,'ngrok-skip-browser-warning':'1'},body:fd});
    const d=await r.json();
    if(d.status==='switched'){resultsSection.style.display='none';errorArea.innerHTML=`<div style="color:var(--violet);font-size:0.8rem;margin-top:0.5rem;font-family:var(--font-display);letter-spacing:0.05em;">⚡ ${d.vertical_name} — ${d.front_embeddings} loaded</div>`;setTimeout(()=>{errorArea.innerHTML='';},3000);}
  }catch(e){showError(e.message);}
}

window.addEventListener('load',()=>setTimeout(loadVerticals,500));

uploadArea.addEventListener('dragover',(e)=>{e.preventDefault();uploadArea.classList.add('dragover');});
uploadArea.addEventListener('dragleave',()=>uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop',(e)=>{e.preventDefault();uploadArea.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
imageInput.addEventListener('change',(e)=>{if(e.target.files.length)handleFile(e.target.files[0]);});
function handleFile(f){selectedFile=f;const r=new FileReader();r.onload=(e)=>{previewImg.src=e.target.result;previewImg.style.display='block';placeholder.style.display='none';uploadArea.classList.add('has-image');matchBtn.disabled=false;};r.readAsDataURL(f);}

matchBtn.addEventListener('click',async()=>{
  if(!selectedFile)return;
  const u=document.getElementById('apiUrl').value.trim(),k=document.getElementById('apiKey').value.trim();
  if(!k){showError('Enter your API key');return;}
  matchBtn.disabled=true;matchBtn.innerHTML='<span class="spinner"></span> SCANNING...';errorArea.innerHTML='';resultsSection.style.display='none';
  const fd=new FormData();fd.append('image',selectedFile);fd.append('top_k',document.getElementById('topK').value);fd.append('include_diagnostics','true');
  try{
    const r=await fetch(u,{method:'POST',headers:{'X-API-Key':k,'ngrok-skip-browser-warning':'1'},body:fd});
    const d=await r.json();
    if(!r.ok){showError(d.error||`HTTP ${r.status}`);return;}
    renderResults(d);
  }catch(e){showError(e.message);}
  finally{matchBtn.disabled=false;matchBtn.textContent='⚡ Identify Card';}
});

function getCurrency(s){s=(s||'').toLowerCase();if(s.includes('cardmarket'))return'€';return'$';}
function toGBP(usd){return(usd*0.79).toFixed(2);}
function rarityClass(r){if(!r)return'';r=r.toLowerCase();if(r.includes('common')&&!r.includes('uncommon'))return'rarity-common';if(r.includes('uncommon'))return'rarity-uncommon';if(r.includes('mythic')||r.includes('secret')||r.includes('ultra'))return'rarity-mythic';if(r.includes('rare')||r.includes('holo'))return'rarity-rare';return'';}

function renderResults(data){
  responseMeta.innerHTML=`<span>⏱ ${data.timing_ms}ms</span><span class="meta-tag">${data.vertical||'?'}</span>`;
  let html='';
  for(const m of data.matches){
    const rawSim=m.similarity||m.score||m.probability;
    const pct=Math.min(100,Math.max(0,Math.round(((rawSim-0.80)/0.18)*100)));
    const level=pct>=75?'high':pct>=45?'mid':'low';
    const circ=2*Math.PI*28,dash=circ-(circ*pct/100);
    let imgSrc='';if(m.images&&m.images.length>0)imgSrc=`${API_BASE.replace('/api/v1','')}/api/v1/image/${m.images[0].image_id}`;
    const p=m.profile||{},cardName=p.name||p.title||'',setName=p.set_name||'',cardNumber=p.card_number||'',rarity=p.rarity||'';

    let tagsHtml='';
    if(rarity)tagsHtml+=`<span class="card-tag ${rarityClass(rarity)}">${rarity.replace(/_/g,' ')}</span>`;
    if(p.energy_type)tagsHtml+=`<span class="card-tag">${p.energy_type.replace(/_/g,' ')}</span>`;
    if(p.mtg_color)tagsHtml+=`<span class="card-tag">${p.mtg_color.replace(/_/g,' ')}</span>`;
    if(p.ygo_card_type)tagsHtml+=`<span class="card-tag">${p.ygo_card_type.replace(/_/g,' ')}</span>`;
    if(p.set_era)tagsHtml+=`<span class="card-tag">${p.set_era.replace(/_/g,' ')}</span>`;
    if(p.type_line)tagsHtml+=`<span class="card-tag">${p.type_line}</span>`;

    let pricesHtml='';
    if(p.prices&&typeof p.prices==='object'){
      for(const[source,sdata]of Object.entries(p.prices)){
        if(!sdata||typeof sdata!=='object')continue;
        let best=null,label='';
        for(const[variant,vdata]of Object.entries(sdata)){
          if(vdata&&typeof vdata==='object'){const pr=vdata.market||vdata.trend||vdata.avg_sell||vdata.mid;if(pr&&(!best||pr<best)){best=pr;label=variant;}}
          else if(typeof vdata==='number'&&vdata>0){if(!best||vdata<best){best=vdata;label=variant;}}
        }
        if(best){
          const curr=getCurrency(source);
          const val=Number(best).toFixed(2);
          const gbp=curr==='$'?` (~£${toGBP(best)})`:curr==='€'?` (~£${(best*0.86).toFixed(2)})`:'';
          pricesHtml+=`<div class="price-chip"><span class="price-source">${source}</span><span class="price-value">${curr}${val}${gbp}</span></div>`;
        }
      }
    }

    let mpHtml='';
    if(cardName){
      const st=`${cardName} ${setName} ${cardNumber}`.trim(),enc=encodeURIComponent(st);
      mpHtml=`
        <a class="mp-link mp-buy" href="https://www.google.com/search?q=site:bigorbitcards.co.uk+${enc}" target="_blank">🇬🇧 Big Orbit</a>
        <a class="mp-link mp-sell" href="https://www.google.com/search?q=site:bigorbitcards.co.uk+sell+${enc}" target="_blank">💷 Sell</a>
        ${p.tcgplayer_url?`<a class="mp-link mp-buy" href="${p.tcgplayer_url}" target="_blank">🇺🇸 TCGPlayer</a>`:`<a class="mp-link mp-buy" href="https://www.tcgplayer.com/search/all/product?q=${enc}" target="_blank">🇺🇸 TCGPlayer</a>`}
        ${p.cardmarket_url?`<a class="mp-link mp-buy" href="${p.cardmarket_url}" target="_blank">🇪🇺 Cardmarket</a>`:`<a class="mp-link mp-buy" href="https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=${enc}" target="_blank">🇪🇺 Cardmarket</a>`}
        <a class="mp-link mp-buy" href="https://www.google.com/search?q=site:cardtrader.com+${enc}" target="_blank">🔄 CardTrader</a>
        <a class="mp-link mp-buy" href="https://totalcards.net/search?q=${enc}" target="_blank">🇬🇧 Total Cards</a>
        <a class="mp-link mp-buy" href="https://www.miniaturemarket.com/searchresults?q=${enc}" target="_blank">🇺🇸 Miniature Market</a>`;
    }

    let xrefHtml='';
    if(p.crossrefs&&Array.isArray(p.crossrefs)){
      const urls={'hd':(c)=>`https://www.davenport-burgess.com/search/${encodeURIComponent(c)}`,'jma':(c)=>`https://jma-uk.co.uk/catalogsearch/result/?q=${encodeURIComponent(c)}`,'silca':(c)=>`https://www.aldridgesecurity.co.uk/catalogsearch/result/?q=${encodeURIComponent(c)}`};
      for(const x of p.crossrefs){const b=x.brand.toLowerCase(),lb=b==='hd'?'HD (Davenport)':x.brand.toUpperCase(),u=urls[b]?urls[b](x.code):`https://www.google.com/search?q=${x.brand}+${encodeURIComponent(x.code)}+key+blank`;xrefHtml+=`<a class="xref-link" href="${u}" target="_blank">${lb}: ${x.code}</a>`;}
    }

    let genLinks='';
    if(!cardName){for(const[k,v]of Object.entries(p)){if(typeof v==='string'&&v.startsWith('http')){const l=k.replace(/_url/g,'').replace(/_/g,' ').trim()||'Link';genLinks+=`<a class="mp-link mp-buy" href="${v}" target="_blank">${l.charAt(0).toUpperCase()+l.slice(1)}</a>`;}}}

    const rc=m.rank<=3?`rank-${m.rank}`:'rank-other';
    html+=`
      <div class="result">
        <div class="result-card-img">
          <div class="rank-badge ${rc}">${m.rank===1?'👑':'#'+m.rank}</div>
          ${imgSrc?`<img class="result-thumb" src="${imgSrc}" onclick="openLightbox('${imgSrc}','${(cardName||m.sku).replace(/'/g,"\\'")}')">`:''}
        </div>
        <div class="result-body">
          ${cardName?`<div class="card-name">${cardName}</div>`:''}
          ${setName?`<div class="card-set">${setName}${cardNumber?' #'+cardNumber:''}</div>`:''}
          <div class="card-sku">${m.sku}</div>
          ${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:''}
          ${pricesHtml?`<div class="card-prices">${pricesHtml}</div>`:''}
          ${mpHtml?`<div class="marketplace">${mpHtml}</div>`:''}
          ${xrefHtml?`<div class="xrefs">${xrefHtml}</div>`:''}
          ${genLinks?`<div class="marketplace">${genLinks}</div>`:''}
        </div>
        <div class="confidence">
          <div class="conf-ring">
            <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="fill-${level}" cx="32" cy="32" r="28" stroke-dasharray="${circ}" stroke-dashoffset="${dash}"/></svg>
            <span class="conf-pct ${level}">${pct}%</span>
          </div>
          <span class="conf-label">Match</span>
        </div>
      </div>`;
  }
  resultsList.innerHTML=html;
  jsonRaw.textContent=JSON.stringify(data,null,2);
  resultsSection.style.display='block';
}

function showError(m){errorArea.innerHTML=`<div class="error-msg">${m}</div>`;}
function toggleJson(){jsonRaw.style.display=jsonRaw.style.display==='none'?'block':'none';}
function openLightbox(s,l){document.getElementById('lightboxImg').src=s;document.getElementById('lightboxLabel').textContent=l||'';document.getElementById('lightbox').classList.add('active');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');document.getElementById('lightboxImg').src='';}
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeLightbox();});
</script>
</body>
</html>
