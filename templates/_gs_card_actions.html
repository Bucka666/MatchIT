<!-- ── Duplicate detection modal ── -->
<div id="dupModal" class="dup-modal-overlay" onclick="if(event.target===this)gsDupCancel()">
  <div class="dup-modal">
    <div class="dup-modal-icon">📋</div>
    <div class="dup-modal-title">Already in Collection</div>
    <div class="dup-modal-msg" id="dupModalMsg"></div>
    <div class="dup-modal-btns">
      <button type="button" class="dup-btn-cancel" onclick="gsDupCancel()">Skip</button>
      <button type="button" class="dup-btn-add" onclick="gsDupConfirm()">Add Another Copy</button>
    </div>
  </div>
</div>

<style>
/* ── Duplicate detection modal ── */
.dup-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 10000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.dup-modal-overlay.is-open {
  display: flex;
}
.dup-modal {
  background: #1a1a2e;
  border-radius: 16px;
  padding: 24px 20px;
  max-width: 320px;
  width: 100%;
  border: 1px solid rgba(177,77,255,0.4);
  text-align: center;
}
.dup-modal-icon { font-size: 2rem; margin-bottom: 8px; }
.dup-modal-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.95rem;
  color: #ffd700;
  font-weight: 700;
  margin-bottom: 10px;
}
.dup-modal-msg {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.7);
  line-height: 1.5;
  margin-bottom: 20px;
}
.dup-modal-btns { display: flex; gap: 10px; justify-content: center; }
.dup-btn-cancel {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.7);
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
}
.dup-btn-add {
  background: linear-gradient(90deg, #b14dff, #00e5ff);
  border: none;
  color: #000;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
}
</style>

<script>
function gsSyncCollection() {
    var code = localStorage.getItem('matchit_access_code_v1');
    if (!code || localStorage.getItem('matchit_premium_v1') !== 'unlocked') return;
    try {
        var items = JSON.parse(localStorage.getItem('matchit_collection_v1') || '[]');
        fetch('/api/collection/sync', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code: code.trim().toUpperCase(), items: items})
        }).catch(function(){});
    } catch(_e) {}
}
function gsSyncWatchlist() {
    var code = localStorage.getItem('matchit_access_code_v1');
    if (!code || localStorage.getItem('matchit_premium_v1') !== 'unlocked') return;
    try {
        var items = JSON.parse(localStorage.getItem('matchit_watchlist_v1') || '[]');
        fetch('/api/watchlist/sync', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code: code.trim().toUpperCase(), items: items})
        }).then(function(r){ console.log('[WATCHLIST] sync', r.status); }).catch(function(e){ console.warn('[WATCHLIST] sync failed', e); });
    } catch(_e) {}
}
function gsFlashButton(btn, text, bgColor, duration) {
    if (!btn) return;
    var origText = btn.textContent;
    var origBg = btn.style.background;
    btn.textContent = text;
    btn.style.background = bgColor;
    btn.disabled = true;
    setTimeout(function() {
      btn.textContent = origText;
      btn.style.background = origBg;
      btn.disabled = false;
    }, duration || 1500);
}
function gsAddToWatchlist(card, btn) {
    try {
        var wl = JSON.parse(localStorage.getItem('matchit_watchlist_v1') || '[]');
        if (wl.some(function(i) { return i.sku === card.sku; })) {
            gsFlashButton(btn, 'Already in Wishlist', '#888888', 1500);
            return;
        }
        wl.push({
            sku:        card.sku || '',
            name:       card.name || '',
            set_name:   card.set_name || '',
            img:        card.img || card.image_url || '',
            gbp_at_add: card.gbp_at_add || card.gbp || card.best_price || 0,
            added:      new Date().toISOString()
        });
        localStorage.setItem('matchit_watchlist_v1', JSON.stringify(wl));
        gsSyncWatchlist();
        gsFlashButton(btn, '✓ Added!', '#00ff88', 1500);
    } catch(_e) {}
}

function gsCountCopies(cardName, setName) {
  try {
    var collection = JSON.parse(localStorage.getItem('matchit_collection_v1') || '[]');
    return collection.filter(function(item) {
      return (item.name || item.set_name) &&
        (item.name || '').trim().toLowerCase() === cardName.trim().toLowerCase() &&
        (item.set_name || item.set || '').trim().toLowerCase() === setName.trim().toLowerCase();
    }).length;
  } catch(e) { return 0; }
}

var _gsDupPendingFn = null;

function gsDupCheck(cardName, setName, proceedFn) {
  var copies = gsCountCopies(cardName, setName);
  if (copies === 0) { proceedFn(); return; }
  var copyWord = copies === 1 ? 'copy' : 'copies';
  document.getElementById('dupModalMsg').innerHTML =
    'You already have <strong>' + copies + ' ' + copyWord + '</strong> of <strong>' +
    cardName + '</strong> (' + setName + ') in your collection.<br><br>' +
    'Do you want to add another copy?';
  _gsDupPendingFn = proceedFn;
  document.getElementById('dupModal').classList.add('is-open');
}

function gsDupConfirm() {
  document.getElementById('dupModal').classList.remove('is-open');
  if (_gsDupPendingFn) { _gsDupPendingFn(); _gsDupPendingFn = null; }
}

function gsDupCancel() {
  document.getElementById('dupModal').classList.remove('is-open');
  _gsDupPendingFn = null;
}

function gsAddToCollection(card, btn) {
  if (localStorage.getItem('matchit_premium_v1') !== 'unlocked') {
    window.location.href='/collection'; return;
  }
  var item = {
    sku: card.sku || '', name: card.name || '', set_name: card.set_name || '',
    card_number: card.card_number || card.number || '',
    set_total: card.set_total || '',
    gbp: card.gbp || card.gbp_at_add || card.best_price || 0,
    img: card.img || card.image_url || '',
    added: new Date().toLocaleDateString('en-GB'),
    grade: card.grade || null
  };
  gsDupCheck(item.name, item.set_name, function() {
    var col = JSON.parse(localStorage.getItem('matchit_collection_v1') || '[]');
    col.push(item);
    localStorage.setItem('matchit_collection_v1', JSON.stringify(col));
    gsSyncCollection();
    gsFlashButton(btn, '✓ Added!', '#00ff88', 1500);
  });
}
</script>
